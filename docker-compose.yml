services:
  ollama:
    image: ollama/ollama:0.12.3
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Récupère le corpus, télécharge le modèle, indexe, puis lance la démonstration.
  # Le banc complet (une heure sur CPU) se lance à part :
  #   docker compose run --rm app bench
  app:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct}
    # Sous l'uid de l'hote : sans cela, les fichiers ecrits dans ./results
    # appartiendraient a un utilisateur inexistant cote hote, et le conteneur ne
    # pourrait pas ecrire dans un repertoire monte qui ne lui appartient pas.
    # L'image reste non privilegiee par defaut ; c'est une adaptation au montage,
    # pas un abandon du principe.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Le corpus est regenere par script dans le conteneur : volume nomme, pas
      # de dependance aux permissions de l'hote.
      - corpus:/app/corpus
      - ./results:/app/results
      - chroma:/app/chroma_db
    entrypoint: ["/app/scripts/demo.sh"]

volumes:
  ollama_models:
  corpus:
  chroma:
